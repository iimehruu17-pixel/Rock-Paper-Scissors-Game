<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel ="stylesheet" href="style.css"> 
</head>
<body>
    <head>
        <h1 class="bar1">Rock Paper Scissor</h1>
    </head>
    <main>
        <div class="bar2">
        <div class="imgs" id="rock" >
            <img src="rock.png">
        </div>
        <div class="imgs" id="paper" >
            <img src="paper.png">
        </div>
        <div class="imgs" id="scissors" >
            <img src="scissors.png">
        </div>
        </div>
        <div class="scoreboard" style="color : #012a4a">
            <div>
                <p class="user">0</p>
                <p>You</p>
            </div>
            <div>
                <p class="comp">0</p>
                <p>Comp</p>
            </div>
        </div>
        <div class="msg-container">
            Play Your Move
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
